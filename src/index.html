<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- CSP is set via native/tauri.conf.json app.security.csp (response header).
       Tauri augments it with hashes for its injected init script, so a separate
       meta CSP would create a second policy that blocks that inline script
       (multiple policies are intersected). Keep the meta CSP absent. -->
  <title>DeepSeek Harness Desktop</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * { box-sizing: border-box; }
    /* `#error`/`#loading` set `display: flex`, which overrides the UA rule
       `[hidden] { display: none }` and would render the error panel (and the
       loading spinner) even when they should be hidden. Restore `hidden` so
       shell.js's hidden-toggling works as intended. */
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #4d9fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { font-size: 13px; color: #8b949e; }
    #error {
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    #error-title { font-size: 16px; font-weight: 600; }
    #error-msg {
      font-size: 13px;
      color: #8b949e;
      word-break: break-all;
      line-height: 1.5;
    }
    #retry-btn {
      margin-top: 8px;
      padding: 8px 20px;
      font-size: 13px;
      font-family: inherit;
      color: #e6edf3;
      background: #1f6feb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #retry-btn:hover { background: #388bfd; }
    #loading { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <div>正在启动 dsh…</div>
    <div class="hint">DeepSeek Harness Desktop</div>
  </div>
  <div id="error" hidden>
    <div id="error-title">启动失败</div>
    <div id="error-msg" class="hint"></div>
    <button id="retry-btn">重试</button>
  </div>
  <script type="module" src="./shell.js"></script>
</body>
</html>
