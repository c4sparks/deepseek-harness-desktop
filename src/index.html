<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- CSP is set via native/tauri.conf.json app.security.csp (response header).
       Tauri augments it with hashes for its injected init script, so a separate
       meta CSP would create a second policy that blocks that inline script
       (multiple policies are intersected). Keep the meta CSP absent. -->
  <title>DeepSeek Harness Desktop</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090f;
      --accent: #4d9fff;
      --text: #e6edf3;
      --dim: #8b949e;
    }
    * { box-sizing: border-box; }
    /* `#error`/`#loading` set `display: flex`, which overrides the UA rule
       `[hidden] { display: none }` and would render the error panel (and the
       loading mark) even when they should be hidden. Restore `hidden` so
       shell.js's hidden-toggling works as intended. */
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--text);
      background:
        radial-gradient(560px 380px at 50% 36%, rgba(77, 159, 255, 0.12), transparent 72%),
        linear-gradient(180deg, #0b1019 0%, var(--bg) 55%, #05070c 100%);
      overflow: hidden;
    }

    /* 签名：雷达脉冲 —— 圆心"正在启动 + 产品名" + 三环扩散，传达"工作区正在上线" */
    #loading { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .radar {
      position: relative; width: 200px; height: 200px;
      display: flex; align-items: center; justify-content: center;
    }
    .radar-label {
      position: relative; z-index: 1; /* 在绝对定位的环之上 */
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .radar-title {
      font-size: 13px; font-weight: 600; color: var(--accent);
      letter-spacing: 0.14em; text-indent: 0.14em; /* 抵消 letter-spacing 尾距，视觉居中 */
      animation: breathe 2.4s ease-in-out infinite;
    }
    .radar-sub {
      font-size: 11px; color: var(--dim);
      letter-spacing: 0.08em; white-space: nowrap;
    }
    .radar-ring {
      position: absolute; inset: 0; margin: auto;
      width: 176px; height: 176px; border-radius: 50%;
      border: 1.5px solid var(--accent);
      animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .radar-ring:nth-child(2) { animation-delay: 1.2s; }
    @keyframes ping {
      0%   { transform: scale(1); opacity: 0.7; }
      80%, 100% { transform: scale(2.1); opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }

    #error {
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    #error-title { font-size: 16px; font-weight: 600; }
    #error-msg {
      font-size: 13px;
      color: var(--dim);
      word-break: break-all;
      line-height: 1.5;
    }
    #retry-btn {
      margin-top: 8px;
      padding: 8px 22px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: #1f6feb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #retry-btn:hover { background: #388bfd; }
    #retry-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .radar-ring { animation: none; opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="radar">
      <div class="radar-ring" aria-hidden="true"></div>
      <div class="radar-ring" aria-hidden="true"></div>
      <div class="radar-label">
        <div class="radar-title">正在启动</div>
        <div class="radar-sub">DeepSeek Harness Desktop</div>
      </div>
    </div>
  </div>
  <div id="error" hidden>
    <div id="error-title">启动失败</div>
    <div id="error-msg"></div>
    <button id="retry-btn">重试</button>
  </div>
  <script type="module" src="./shell.js"></script>
</body>
</html>
